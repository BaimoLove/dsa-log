# /etc/nginx/conf.d/dsa.conf
#
# 结构：nginx 是唯一对公网开口的进程。
#   静态 dist（带 hash 的 assets 长缓存，index.html 不缓存）
#   /api/ → 127.0.0.1:8080（后端只监听回环，绕不过这一层）
#   整站 basic auth：没有它，8080 一暴露就等于把私人题库公开
#
# 前端是 hash 路由（#/problems），路径不进服务端，所以 try_files 只要兜住 `/` 即可。
server {
    listen 80;
    server_name _;

    # 导入备份可能几十 MB；后端单次批量上限 500 条也是这个量级
    client_max_body_size 32m;

    auth_basic           "DSA Log";
    auth_basic_user_file /etc/nginx/.htpasswd;

    access_log /var/log/nginx/dsa-access.log;
    error_log  /var/log/nginx/dsa-error.log warn;

    # 带内容哈希的产物，内容变了文件名就变，可以放心长缓存
    location /assets/ {
        alias /opt/dsa/web/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        root /opt/dsa/web/dist;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 导出走附件流、导入是本地上传的大 JSON：
        # 关掉缓冲才是「边收边转发」，否则 nginx 会把整个文件先落到临时目录
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    root /opt/dsa/web/dist;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 不允许访问隐藏文件（.env / .git 之类），但放行 ACME 的 .well-known
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(sql|log|db|bak|jar)$ { deny all; }
}
